name: Build Astro

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Instalar exactamente las versiones
      #    especificadas en package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Comprobar que Astro puede construir el proyecto
      - name: Build Astro
        run: npm run build
